```html
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>Study Time Table</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#0d0d0f;
  color:#f7f7f7;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center
}

.app{
  width:100%;
  max-width:520px;
  padding:24px 20px 32px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start
}

.date{
  font-size:13px;
  color:#999
}

.clock{
  font-size:28px;
  font-weight:700;
  letter-spacing:-1px
}

.badge{
  margin-top:6px;
  display:inline-block;
  padding:5px 9px;
  border-radius:99px;
  background:#252326;
  color:#ff8796;
  font-size:11px
}

.ringWrap{
  display:flex;
  justify-content:center;
  margin:38px 0 30px
}

.ring{
  width:min(72vw,300px);
  height:min(72vw,300px);
  border-radius:50%;
  position:relative;
  display:grid;
  place-items:center
}

svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transform:rotate(-90deg)
}

circle{
  fill:none;
  stroke-width:10
}

.bg{
  stroke:#262428
}

.prog{
  stroke:#ff7f8d;
  stroke-linecap:round;
  transition:stroke-dashoffset .4s linear
}

.center{
  text-align:center;
  z-index:1
}

.period{
  font-size:15px;
  color:#aaa;
  margin-bottom:8px
}

.remain{
  font-size:48px;
  font-weight:800;
  letter-spacing:-2px
}

.label{
  font-size:12px;
  color:#777;
  margin-top:5px
}

/* 총 공부시간 */
.total{
  background:#171619;
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.total small{
  color:#777
}

.total strong{
  font-size:14px
}

.list{
  display:grid;
  gap:8px
}

.row{
  display:grid;
  grid-template-columns:72px 1fr 62px;
  align-items:center;
  padding:13px 14px;
  border-radius:13px;
  background:#151416;
  color:#aaa
}

.row.active{
  background:#24191b;
  color:#fff;
  outline:1px solid #ff7f8d
}

.time{
  font-size:12px;
  color:#777
}

.name{
  font-weight:650;
  font-size:14px
}

.dur{
  text-align:right;
  font-size:12px;
  color:#777
}

.row.active .time,
.row.active .dur{
  color:#ff9aa5
}

.footer{
  margin-top:18px;
  text-align:center;
  color:#555;
  font-size:11px
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div>
      <div class="date" id="date"></div>
      <span class="badge">실시간 자동</span>
    </div>

    <div class="clock" id="clock"></div>
  </div>


  <div class="ringWrap">

    <div class="ring">

      <svg viewBox="0 0 300 300">

        <circle
          class="bg"
          cx="150"
          cy="150"
          r="136"
        />

        <circle
          class="prog"
          id="prog"
          cx="150"
          cy="150"
          r="136"
        />

      </svg>


      <div class="center">

        <div class="period" id="period">
          대기 중
        </div>

        <div class="remain" id="remain">
          00:00:00
        </div>

        <div class="label" id="label">
          08:30 시작
        </div>

      </div>

    </div>

  </div>


  <!-- 총 공부시간 -->

  <div class="total">

    <small>총 공부시간</small>

    <strong id="totalStudy">
      0시간 00분 / 10시간 30분
    </strong>

  </div>


  <!-- 시간표 -->

  <div class="list" id="list"></div>


  <div class="footer">
    화면을 켜둔 채 공부하세요 · 오전 시작용
  </div>

</div>


<script>

/* 시간표 */

const S=[

  ["08:30","10:00","1교시"],

  ["10:00","11:30","2교시"],

  ["11:30","12:15","점심"],

  ["12:15","13:45","3교시"],

  ["13:45","15:15","4교시"],

  ["15:15","16:45","5교시"],

  ["16:45","17:45","저녁"],

  ["17:45","19:15","6교시"],

  ["19:15","20:45","7교시"]

];


const $=id=>document.getElementById(id);

const pad=n=>String(n).padStart(2,"0");


const mins=t=>{

  let[a,b]=t.split(":").map(Number);

  return a*60+b;

};


function render(){

  const now=new Date();

  const h=now.getHours();

  const m=now.getMinutes();

  const sec=now.getSeconds();

  const cur=h*60+m+sec/60;


  /* 날짜 */

  $("date").textContent=

    now.toLocaleDateString("ko-KR",{

      year:"numeric",

      month:"long",

      day:"numeric",

      weekday:"short"

    });


  /* 현재 시각 */

  $("clock").textContent=

    `${pad(h)}:${pad(m)}:${pad(sec)}`;


  /* 현재 교시 */

  let idx=S.findIndex(

    x=>cur>=mins(x[0])&&cur<mins(x[1])

  );


  /* 시간표 표시 */

  const list=$("list");

  list.innerHTML="";


  S.forEach((x,i)=>{

    let d=document.createElement("div");

    d.className=

      "row"+(i===idx?" active":"");


    d.innerHTML=`

      <div class="time">

        ${x[0]}–${x[1]}

      </div>

      <div class="name">

        ${x[2]}

      </div>

      <div class="dur">

        ${mins(x[1])-mins(x[0])}분

      </div>

    `;


    list.appendChild(d);

  });


  /*

    현재까지 공부한 시간 계산

    점심 / 저녁은 공부시간에서 제외

  */

  let studiedMinutes=0;


  S.forEach(x=>{

    const start=mins(x[0]);

    const end=mins(x[1]);


    if(

      x[2]!=="점심" &&

      x[2]!=="저녁"

    ){

      if(cur>=end){

        studiedMinutes += end-start;

      }

      else if(cur>start){

        studiedMinutes += cur-start;

      }

    }

  });


  /* 공부시간을 시간 + 분으로 변환 */

  const studiedHours=

    Math.floor(studiedMinutes/60);


  const studiedMins=

    Math.floor(studiedMinutes%60);


  const studiedText=

    `${studiedHours}시간 ${pad(studiedMins)}분`;


  /* 총 공부시간 표시 */

  $("totalStudy").textContent=

    `${studiedText} / 10시간 30분`;


  /* 현재 교시 */

  if(idx>=0){

    const x=S[idx];


    const total=

      (mins(x[1])-mins(x[0]))*60;


    const left=Math.max(

      0,

      Math.round((mins(x[1])-cur)*60)

    );


    $("period").textContent=

      x[2];


    $("remain").textContent=

      `${pad(Math.floor(left/3600))}:` +

      `${pad(Math.floor(left%3600/60))}:` +

      `${pad(left%60)}`;


    $("label").textContent=

      `${x[0]}–${x[1]}`;


    /* 원형 진행률 */

    let p=

      Math.min(

        1,

        Math.max(0,left/total)

      );


    let c=

      2*Math.PI*136;


    $("prog").style.strokeDasharray=c;


    $("prog").style.strokeDashoffset=

      c*(1-p);


  }

  else{


    $("remain").textContent=

      "00:00:00";


    if(cur<mins(S[0][0])){

      $("period").textContent=

        "시작 전";


      $("label").textContent=

        `${S[0][0]} 시작`;

    }

    else{

      $("period").textContent=

        "오늘 끝";


      $("label").textContent=

        "수고했어요";

    }


    $("prog").style.strokeDasharray=

      2*Math.PI*136;


    $("prog").style.strokeDashoffset=0;

  }

}


/* 처음 실행 */

render();


/* 1초마다 갱신 */

setInterval(render,1000);

</script>

</body>
</html>
```
