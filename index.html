<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Morning Study Time Table</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  background:#0d0d0f;
  color:#f7f7f7;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center
}

.app{
  width:100%;
  max-width:520px;
  padding:24px 20px 32px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start
}

.date{
  font-size:13px;
  color:#999
}

.clock{
  font-size:28px;
  font-weight:700;
  letter-spacing:-1px
}

.badge{
  margin-top:6px;
  display:inline-block;
  padding:5px 9px;
  border-radius:99px;
  background:#252326;
  color:#ff8796;
  font-size:11px
}

.ringWrap{
  display:flex;
  justify-content:center;
  margin:38px 0 30px
}

.ring{
  width:min(72vw,300px);
  height:min(72vw,300px);
  border-radius:50%;
  position:relative;
  display:grid;
  place-items:center
}

svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  transform:rotate(-90deg)
}

circle{
  fill:none;
  stroke-width:10
}

.bg{
  stroke:#262428
}

.prog{
  stroke:#ff7f8d;
  stroke-linecap:round;
  transition:stroke-dashoffset .4s linear
}

.center{
  text-align:center;
  z-index:1
}

.period{
  font-size:15px;
  color:#aaa;
  margin-bottom:8px
}

.remain{
  font-size:48px;
  font-weight:800;
  letter-spacing:-2px
}

.label{
  font-size:12px;
  color:#777;
  margin-top:5px
}

.total{
  background:#171619;
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:18px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.total small{
  color:#777
}

.total strong{
  font-size:14px
}

.list{
  display:grid;
  gap:8px
}

.row{
  display:grid;
  grid-template-columns:72px 1fr 62px;
  align-items:center;
  padding:13px 14px;
  border-radius:13px;
  background:#151416;
  color:#aaa
}

.row.active{
  background:#24191b;
  color:#fff;
  outline:1px solid #ff7f8d
}

.time{
  font-size:12px;
  color:#777
}

.name{
  font-weight:650;
  font-size:14px
}

.dur{
  text-align:right;
  font-size:12px;
  color:#777
}

.row.active .time,
.row.active .dur{
  color:#ff9aa5
}

.footer{
  margin-top:18px;
  text-align:center;
  color:#555;
  font-size:11px
}


/* ================================
   가로 화면
   ================================ */

@media (orientation:landscape){

  body{
    min-height:100vh;
    align-items:center
  }

  .app{
    max-width:1100px;
    width:100%;
    height:100vh;
    max-height:650px;
    padding:14px 24px;
    display:grid;
    grid-template-columns:43% 57%;
    grid-template-rows:auto 1fr auto;
    column-gap:24px
  }

  .top{
    grid-column:1;
    grid-row:1;
    align-self:start
  }

  /* 왼쪽 카운트다운 */

  .ringWrap{
    grid-column:1;
    grid-row:1 / span 3;

    margin:0;

    align-self:center;
    justify-self:center;

    transform:translateY(-45px);

    display:flex;
    flex-direction:column;
    align-items:center
  }

  .ring{
    width:min(43vh,270px);
    height:min(43vh,270px)
  }

  .remain{
    font-size:40px
  }

  /* 총 공부시간 */

  .total{
    grid-column:1;
    grid-row:1 / span 3;

    align-self:center;
    justify-self:center;

    width:auto;
    min-width:190px;

    padding:7px 12px;

    margin-top:255px;

    border-radius:12px;

    position:relative;
    z-index:2
  }

  .total small{
    font-size:9px
  }

  .total strong{
    font-size:11px
  }

  /* 오른쪽 시간표 */

  .list{
    grid-column:2;
    grid-row:1 / span 2;

    align-self:center;

    gap:5px
  }

  .row{
    min-height:37px;
    padding:7px 11px;
    border-radius:11px
  }

  .time{
    font-size:11px
  }

  .name{
    font-size:13px
  }

  .dur{
    font-size:11px
  }

  .footer{
    grid-column:2;
    grid-row:3;
    margin:7px 0 0;
    font-size:9px
  }
}


/* ================================
   좁은 가로 화면
   ================================ */

@media (orientation:landscape) and (max-height:430px){

  .app{
    padding:8px 16px;
    grid-template-columns:43% 57%;
    column-gap:16px
  }

  .date{
    font-size:10px
  }

  .clock{
    font-size:21px
  }

  .badge{
    margin-top:3px;
    padding:3px 6px;
    font-size:8px
  }

  .ringWrap{
    transform:translateY(-30px)
  }

  .ring{
    width:min(38vh,215px);
    height:min(38vh,215px)
  }

  .period{
    font-size:12px;
    margin-bottom:3px
  }

  .remain{
    font-size:32px
  }

  .label{
    font-size:9px
  }

  .total{
    min-width:160px;
    padding:5px 9px;
    margin-top:205px
  }

  .total small{
    font-size:8px
  }

  .total strong{
    font-size:10px
  }

  .list{
    gap:3px
  }

  .row{
    min-height:29px;
    padding:4px 8px;
    border-radius:9px
  }

  .time,
  .dur{
    font-size:9px
  }

  .name{
    font-size:11px
  }

  .footer{
    font-size:8px;
    margin-top:4px
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div>
      <div class="date" id="date"></div>
      <span class="badge">실시간 자동</span>
    </div>

    <div class="clock" id="clock"></div>
  </div>

  <div class="ringWrap">

    <div class="ring">

      <svg viewBox="0 0 300 300">

        <circle
          class="bg"
          cx="150"
          cy="150"
          r="136"
        />

        <circle
          class="prog"
          id="prog"
          cx="150"
          cy="150"
          r="136"
        />

      </svg>

      <div class="center">

        <div class="period" id="period">
          대기 중
        </div>

        <div class="remain" id="remain">
          00:00:00
        </div>

        <div class="label" id="label">
          08:30 시작
        </div>

      </div>

    </div>

  </div>

  <div class="total">

    <small>총 공부시간</small>

    <strong id="totalStudy">
      0시간 00분 / 10시간 30분
    </strong>

  </div>

  <div class="list" id="list"></div>

  <div class="footer">
    화면을 켜둔 채 공부하세요 · 오전 시작용
  </div>

</div>


<script>

const S=[

  ["08:30","10:00","1교시"],

  ["10:00","11:30","2교시"],

  ["11:30","12:15","점심"],

  ["12:15","13:45","3교시"],

  ["13:45","15:15","4교시"],

  ["15:15","16:45","5교시"],

  ["16:45","17:45","저녁"],

  ["17:45","19:15","6교시"],

  ["19:15","20:45","7교시"]

];

const $=id=>document.getElementById(id);

const pad=n=>String(n).padStart(2,"0");

const mins=t=>{

  let[a,b]=t.split(":").map(Number);

  return a*60+b;

};

function render(){

  const now=new Date();

  const h=now.getHours();

  const m=now.getMinutes();

  const sec=now.getSeconds();

  const cur=h*60+m+sec/60;

  $("date").textContent=

    now.toLocaleDateString("ko-KR",{

      year:"numeric",

      month:"long",

      day:"numeric",

      weekday:"short"

    });

  $("clock").textContent=

    `${pad(h)}:${pad(m)}:${pad(sec)}`;

  let idx=S.findIndex(

    x=>cur>=mins(x[0])&&cur<mins(x[1])

  );

  const list=$("list");

  list.innerHTML="";

  S.forEach((x,i)=>{

    let d=document.createElement("div");

    d.className="row"+(i===idx?" active":"");

    d.innerHTML=`

      <div class="time">${x[0]}–${x[1]}</div>

      <div class="name">${x[2]}</div>

      <div class="dur">${mins(x[1])-mins(x[0])}분</div>

    `;

    list.appendChild(d);

  });

  let studiedMinutes=0;

  S.forEach(x=>{

    const start=mins(x[0]);

    const end=mins(x[1]);

    if(x[2]!=="점심" && x[2]!=="저녁"){

      if(cur>=end){

        studiedMinutes += end-start;

      }

      else if(cur>start){

        studiedMinutes += cur-start;

      }

    }

  });

  const studiedHours=Math.floor(studiedMinutes/60);

  const studiedMins=Math.floor(studiedMinutes%60);

  const studiedText=

    `${studiedHours}시간 ${pad(studiedMins)}분`;

  $("totalStudy").textContent=

    `${studiedText} / 10시간 30분`;

  if(idx>=0){

    const x=S[idx];

    const total=(mins(x[1])-mins(x[0]))*60;

    const left=Math.max(

      0,

      Math.round((mins(x[1])-cur)*60)

    );

    $("period").textContent=x[2];

    $("remain").textContent=

      `${pad(Math.floor(left/3600))}:` +

      `${pad(Math.floor(left%3600/60))}:` +

      `${pad(left%60)}`;

    $("label").textContent=

      `${x[0]}–${x[1]}`;

    let p=Math.min(

      1,

      Math.max(0,left/total)

    );

    let c=2*Math.PI*136;

    $("prog").style.strokeDasharray=c;

    $("prog").style.strokeDashoffset=c*(1-p);

  }

  else{

    $("remain").textContent="00:00:00";

    if(cur<mins(S[0][0])){

      $("period").textContent="시작 전";

      $("label").textContent=

        `${S[0][0]} 시작`;

    }

    else{

      $("period").textContent="오늘 끝";

      $("label").textContent="수고했어요";

    }

    $("prog").style.strokeDasharray=

      2*Math.PI*136;

    $("prog").style.strokeDashoffset=0;

  }

}

render();

setInterval(render,1000);

</script>

</body>
</html>
