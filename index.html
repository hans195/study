<title>Morning</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#080a0f;
  color:#f5f7fa;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
}

body{
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

.top{
  height:76px;
  padding:14px 18px 8px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.date{
  font-size:13px;
  color:#8b95a5;
}

.clock{
  margin-top:3px;
  font-size:23px;
  font-weight:700;
  letter-spacing:-.5px;
}

.badge{
  margin-top:3px;
  padding:5px 9px;
  border-radius:999px;
  background:#2a2614;
  color:#facc15;
  font-size:11px;
  font-weight:700;
}

.main{
  flex:1;
  display:flex;
  min-height:0;
}

.left{
  width:65%;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  padding-top:8px;
}

.ring{
  width:min(62vh,390px);
  height:min(62vh,390px);
  position:relative;
  margin-top:24px;
}

.ring svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
}

.ring-bg{
  fill:none;
  stroke:#20242c;
  stroke-width:10;
}

.ring-progress{
  fill:none;
  stroke:#facc15;
  stroke-width:10;
  stroke-linecap:round;
  transition:stroke-dashoffset .5s linear;
}

.center{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.remain{
  font-size:56px;
  font-weight:800;
  letter-spacing:-2px;
}

.period{
  margin-top:4px;
  margin-bottom:6px;
  font-size:16px;
  font-weight:700;
  color:#fde047;
}

.label{
  font-size:12px;
  color:#8b95a5;
}

.total{
  margin-top:325px;
  padding:9px 14px;
  border:1px solid #20242c;
  border-radius:10px;
  color:#aab2bf;
  font-size:12px;
  background:#0d1016;
}

.right{
  width:35%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-start;
  padding:0 24px 0 0;
}

.list{
  width:100%;
  max-width:260px;
  display:flex;
  flex-direction:column;
  gap:0;
  transform:translateX(-22px);
}

  display:grid;
  grid-template-columns:82px 1fr auto;
  column-gap:4px;
  align-items:center;
