<style>

  display:flex;

<body>


<div class="app">


  <div class="top">

    <div class="date" id="date"></div>

    <div class="clock" id="clock"></div>

    <div class="badge">
      실시간 자동
    </div>

  </div>


  <div class="ringWrap">


    <div class="ring">


      <svg viewBox="0 0 300 300">


        <circle
          class="ring-bg"
          cx="150"
          cy="150"
          r="136">
        </circle>


        <circle
          id="progress"
          class="ring-progress"
          cx="150"
          cy="150"
          r="136">
        </circle>


      </svg>


      <div class="center">


        <div class="period" id="period">
          시작 전
        </div>


        <div class="remain" id="remain">
          00:00
        </div>


        <div class="label">
          남은 시간
        </div>


      </div>


    </div>


  </div>


  <div class="total">


    <small>
      오늘 총 공부시간
    </small>


    <strong id="total">
      0시간 00분 / 12시간 00분
    </strong>


  </div>


  <div class="right">


    <div class="list" id="list"></div>


    <div class="footer">
      돈 벌러 가자
    </div>


  </div>


</div>


<script>


const $ = id =>
  document.getElementById(id);


/* =========================
   시간표
========================= */

const S = [

  ["08:30","10:00","1교시"],

  ["10:00","10:15","휴식"],

  ["10:15","11:45","2교시"],

  ["11:45","12:30","점심"],

  ["12:30","14:00","3교시"],

  ["14:00","14:15","휴식"],

  ["14:15","15:45","4교시"],

  ["15:45","16:00","휴식"],

  ["16:00","17:30","5교시"],

  ["17:30","18:30","저녁"],

  ["18:30","20:00","6교시"],

  ["20:00","20:15","휴식"],

  ["20:15","21:45","7교시"],

  ["21:45","22:00","휴식"],

  ["22:00","23:30","8교시"]

];


/* =========================
   기본 함수
========================= */

function pad(n){

  return String(n)
    .padStart(2,"0");

}


function mins(t){

  const [h,m] =
    t.split(":").map(Number);

  return h * 60 + m;

}


function formatRemain(sec){

  sec =
    Math.max(
      0,
      Math.floor(sec)
    );


  const h =
    Math.floor(sec / 3600);


  const m =
    Math.floor(
      (sec % 3600) / 60
    );


  const s =
    sec % 60;


  if(h > 0){

    return `${h}:${pad(m)}:${pad(s)}`;

  }


  return `${pad(m)}:${pad(s)}`;

}


/* =========================
   총 공부시간
========================= */

const TOTAL_STUDY_MINUTES =

  S.reduce(
    (sum,[start,end,name]) => {

      if(
        name === "휴식" ||
        name === "점심" ||
        name === "저녁"
      ){

        return sum;

      }


      return sum +
        mins(end) -
        mins(start);

    },
    0
  );


/* =========================
   원형 게이지
========================= */

const R = 136;

const C =
  2 * Math.PI * R;


$("progress")
  .style
  .strokeDasharray = C;


$("progress")
  .style
  .strokeDashoffset = C;


/* =========================
   날짜 / 시계
========================= */

function updateDateClock(){

  const now =
    new Date();


  const days = [

    "일",
    "월",
    "화",
    "수",
    "목",
    "금",
    "토"

  ];


  $("date").textContent =

    `${now.getFullYear()}년 ` +
    `${now.getMonth()+1}월 ` +
    `${now.getDate()}일 ` +
    `(${days[now.getDay()]})`;


  $("clock").textContent =

    `${pad(now.getHours())}:` +
    `${pad(now.getMinutes())}:` +
    `${pad(now.getSeconds())}`;

}


/* =========================
   오른쪽 시간표
========================= */

function renderSchedule(current){

  const list =
    $("list");


  list.innerHTML = "";


  let activeIndex = -1;


  S.forEach((item,i) => {

    const [
      start,
      end,
      name
    ] = item;


    const st =
      mins(start);


    const en =
      mins(end);


    /*
      휴식은 오른쪽에서 숨김
    */

    if(name === "휴식"){

      return;

    }


    const row =
      document.createElement("div");


    row.className =
      "row";


    if(
      current >= st &&
      current < en
    ){

      row.classList.add("active");

      activeIndex = i;

    }


    const duration =
      en - st;


    row.innerHTML = `

      <div class="time">
        ${start} - ${end}
      </div>

      <div class="name">
        ${name}
      </div>

      <div class="dur">
        (${duration}')
      </div>

    `;


    list.appendChild(row);

  });


  return activeIndex;

}


/* =========================
   총 공부시간 계산
========================= */

function updateTotalStudy(current){

  let totalStudy = 0;


  S.forEach(
    ([start,end,name]) => {

      if(
        name === "휴식" ||
        name === "점심" ||
        name === "저녁"
      ){

        return;

      }


      const st =
        mins(start);


      const en =
        mins(end);


      if(current >= en){

        totalStudy +=
          en - st;

      }

      else if(current > st){

        totalStudy +=
          current - st;

      }

    }
  );


  totalStudy =
    Math.max(
      0,
      Math.floor(totalStudy)
    );


  totalStudy =
    Math.min(
      totalStudy,
      TOTAL_STUDY_MINUTES
    );


  const h =
    Math.floor(
      totalStudy / 60
    );


  const m =
    totalStudy % 60;


  const totalH =
    Math.floor(
      TOTAL_STUDY_MINUTES / 60
    );


  const totalM =
    TOTAL_STUDY_MINUTES % 60;


  $("total").textContent =

    `${h}시간 ${pad(m)}분 / ` +
    `${totalH}시간 ${pad(totalM)}분`;

}


/* =========================
   메인 업데이트
========================= */

function update(){

  const now =
    new Date();


  updateDateClock();


  const current =

    now.getHours() * 60 +

    now.getMinutes() +

    now.getSeconds() / 60;


  renderSchedule(current);


  updateTotalStudy(current);


  /*
    휴식 포함 현재 시간대 찾기
  */

  let currentIndex = -1;


  for(
    let i = 0;
    i < S.length;
    i++
  ){

    const st =
      mins(S[i][0]);


    const en =
      mins(S[i][1]);


    if(
      current >= st &&
      current < en
    ){

      currentIndex = i;

      break;

    }

  }


  /* =========================
     현재 시간대
  ========================= */

  if(currentIndex >= 0){

    const [
      start,
      end,
      name
    ] = S[currentIndex];


    const st =
      mins(start);


    const en =
      mins(end);


    const duration =
      en - st;


    const remainSec =

      Math.max(
        0,
        Math.round(
          (en - current) * 60
        )
      );


    /*
      시작 0
      종료 1
    */

    const progress =

      Math.min(
        1,
        Math.max(
          0,
          (current - st) /
          duration
        )
      );


    /*
      공부/쉬는시간 모두
      시작 100%
      종료 0%
    */

    $("progress")
      .style
      .strokeDashoffset =
        C * progress;


    /*
      공부시간
    */

    if(
      name === "휴식" ||
      name === "점심" ||
      name === "저녁"
    ){

      $("period").textContent =
        "쉬는 시간";

    }

    else{

      $("period").textContent =
        name;

    }


    $("remain").textContent =
      formatRemain(remainSec);


    return;

  }


  /* =========================
     첫 교시 전
  ========================= */

  if(
    current <
    mins(S[0][0])
  ){

    const startTime =
      mins(S[0][0]);


    const diff =

      Math.max(
        0,
        Math.round(
          (startTime - current) *
          60
        )
      );


    $("period").textContent =
      "시작 전";


    $("remain").textContent =
      formatRemain(diff);


    $("progress")
      .style
      .strokeDashoffset = C;


    return;

  }


  /* =========================
     하루 끝
  ========================= */

  $("period").textContent =
    "오늘 끝";


  $("remain").textContent =
    "수고했어요";


  $("progress")
    .style
    .strokeDashoffset = C;

}


/* =========================
   실행
========================= */

update();

setInterval(
  update,
  1000
);

</script>

</body>
</html>
