<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Morning</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090d14;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

.app{
  width:100%;
  height:100%;
  max-width:600px;
  padding:18px 18px;
  display:flex;
  flex-direction:column;
}

.top{
  text-align:center;
  flex:none;
}

.date{
  font-size:18px;
  color:#9aa4b2;
  margin-bottom:3px;
}

.clock{
  font-size:28px;
  font-weight:700;
  letter-spacing:-1px;
}

.badge{
  display:inline-block;
  margin-top:6px;
  padding:5px 9px;
  border-radius:999px;
  background:#182b20;
  color:#86efac;
  font-size:10px;
  font-weight:600;
}

.ringWrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex:1;
  margin:8px 0;
}

.ring{
  width:min(58vw,280px);
  height:min(58vw,280px);
  position:relative;
}

.ring svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
}

.ring-bg{
  fill:none;
  stroke:#202938;
  stroke-width:10;
}

.ring-progress{
  fill:none;
  stroke:#86efac;
  stroke-width:10;
  stroke-linecap:round;
  transition:stroke-dashoffset .5s linear;
}

.center{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.period{
  font-size:15px;
  color:#9aa4b2;
  margin-bottom:5px;
}

.remain{
  font-size:46px;
  font-weight:800;
  letter-spacing:-2px;
}

.label{
  margin-top:3px;
  font-size:11px;
  color:#8b95a5;
}

.total{
  flex:none;
  width:fit-content;
  min-width:190px;
  margin:0 auto 10px;
  padding:8px 13px;
  border:1px solid #202938;
  border-radius:12px;
  background:#111722;
  text-align:center;
}

.total small{
  display:block;
  color:#8b95a5;
  font-size:9px;
  margin-bottom:2px;
}

.total strong{
  font-size:12px;
}

.right{
  flex:none;
}

.list{
  display:grid;
  gap:6px;
}

.row{
  display:grid;
  grid-template-columns:70px auto 55px;
  column-gap:8px;
  align-items:center;
  min-height:45px;
  padding:9px 12px;
  border:1px solid #1d2635;
  border-radius:12px;
  background:#111722;
  transition:.2s;
}

.row.active{
  background:#182b20;
  border-color:#86efac;
  box-shadow:0 0 0 1px rgba(134,239,172,.18);
}

.time{
  font-size:12px;
  color:#8b95a5;
}

.name{
  font-size:14px;
  font-weight:700;
}

.dur{
  font-size:12px;
  color:#8b95a5;
  text-align:left;
}

.row.active .name{
  color:#86efac;
}

.footer{
  margin-top:9px;
  text-align:center;
  color:#667181;
  font-size:9px;
  line-height:1;
}


/* =========================
   가로 화면
========================= */

@media (orientation:landscape){

  .app{
    max-width:1100px;
    width:100%;
    height:100vh;
    max-height:650px;
    padding:14px 24px;

    display:grid;
    grid-template-columns:50% 50%;
    grid-template-rows:auto 1fr;

    column-gap:18px;
  }

  .top{
    grid-column:1;
    grid-row:1;
    align-self:start;
  }

  /* 왼쪽 원형 시계 */
  .ringWrap{
    grid-column:1;
    grid-row:1 / span 2;

    margin:0;

    align-self:center;
    justify-self:center;

    transform:translateY(-25px);

    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .ring{
    width:min(56vh,350px);
    height:min(56vh,350px);
  }

  .remain{
    font-size:50px;
  }

  /* 총 공부시간 */
  .total{
    grid-column:1;
    grid-row:1 / span 2;

    align-self:center;
    justify-self:center;

    width:auto;
    min-width:205px;

    padding:8px 13px;

    margin-top:370px;

    border-radius:12px;

    position:relative;
    z-index:2;
  }

  .total small{
    font-size:10px;
  }

  .total strong{
    font-size:12px;
  }

  /* 오른쪽 시간표
     위쪽에 붙여서 날짜와 균형 */
  .right{
    grid-column:2;
    grid-row:1 / span 2;

    align-self:start;

    display:flex;
    flex-direction:column;
    justify-content:flex-start;

    transform:none;

    padding-top:0;
  }

  .list{
    display:grid;
    gap:5px;
  }

  .row{
    grid-template-columns:70px auto 55px;
    column-gap:8px;

    min-height:41px;

    padding:8px 12px;

    border-radius:12px;
  }

  .time{
    font-size:12px;
  }

  .name{
    font-size:14px;
  }

  .dur{
    font-size:12px;
  }

  .footer{
    margin-top:6px;
    text-align:center;
    font-size:9px;
    line-height:1;
  }
}


/* =========================
   낮은 높이의 가로 화면
========================= */

@media (orientation:landscape) and (max-height:430px){

  .app{
    padding:8px 16px;
    grid-template-columns:50% 50%;
    column-gap:12px;
  }

  .date{
    font-size:18px;
  }

  .clock{
    font-size:21px;
  }

  .badge{
    margin-top:3px;
    padding:3px 6px;
    font-size:8px;
  }

  .ringWrap{
    transform:translateY(-20px);
  }

  .ring{
    width:min(48vh,265px);
    height:min(48vh,265px);
  }

  .period{
    font-size:12px;
    margin-bottom:3px;
  }

  .remain{
    font-size:36px;
  }

  .label{
    font-size:9px;
  }

  .total{
    min-width:170px;
    padding:6px 10px;
    margin-top:285px;
  }

  .total small{
    font-size:8px;
  }

  .total strong{
    font-size:10px;
  }

  .right{
    padding-top:0;
  }

  .list{
    gap:3px;
  }

  .row{
    grid-template-columns:70px auto 45px;
    column-gap:5px;

    min-height:31px;

    padding:5px 9px;
  }

  .time,
  .dur{
    font-size:10px;
  }

  .name{
    font-size:12px;
  }

  .footer{
    margin-top:1px;
    font-size:8px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>
    <div class="badge">● 실시간 자동</div>
  </div>

  <div class="ringWrap">
    <div class="ring">

      <svg viewBox="0 0 300 300">
        <circle class="ring-bg" cx="150" cy="150" r="136"/>
        <circle class="ring-progress" id="progress" cx="150" cy="150" r="136"/>
      </svg>

      <div class="center">
        <div class="period" id="period">시작 전</div>
        <div class="remain" id="remain">00:00</div>
        <div class="label">남은 시간</div>
      </div>

    </div>
  </div>

  <div class="total">
    <small>오늘 총 공부시간</small>
    <strong id="total">0시간 00분 / 10시간 30분</strong>
  </div>

  <div class="right">

    <div class="list" id="list"></div>

    <div class="footer">
      화면을 켜둔 채 공부하세요 · 오전 시작용
    </div>

  </div>

</div>

<script>
const $ = id => document.getElementById(id);

const S = [
  ["08:30","10:00","1교시"],
  ["10:00","11:30","2교시"],
  ["11:30","12:15","점심"],
  ["12:15","13:45","3교시"],
  ["13:45","15:15","4교시"],
  ["15:15","16:45","5교시"],
  ["16:45","17:45","저녁"],
  ["17:45","19:15","6교시"],
  ["19:15","20:45","7교시"]
];

const R = 136;
const C = 2 * Math.PI * R;

$("progress").style.strokeDasharray = C;

function pad(n){
  return String(n).padStart(2,"0");
}

function mins(t){
  const [h,m] = t.split(":").map(Number);
  return h * 60 + m;
}

function formatRemain(sec){

  sec = Math.max(0, Math.floor(sec));

  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;

  if(h > 0){
    return `${h}:${pad(m)}:${pad(s)}`;
  }

  return `${pad(m)}:${pad(s)}`;
}

function render(){

  const now = new Date();

  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();

  const current = h * 60 + m + s / 60;

  const weekdays = [
    "일요일",
    "월요일",
    "화요일",
    "수요일",
    "목요일",
    "금요일",
    "토요일"
  ];

  $("date").textContent =
    `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} ${weekdays[now.getDay()]}`;

  $("clock").textContent =
    `${pad(h)}:${pad(m)}:${pad(s)}`;

  const list = $("list");

  list.innerHTML = "";

  let activeIndex = -1;

  S.forEach((item,i) => {

    const [start,end,name] = item;

    const st = mins(start);
    const en = mins(end);

    const row = document.createElement("div");

    row.className = "row";

    if(current >= st && current < en){
      row.classList.add("active");
      activeIndex = i;
    }

    const duration = en - st;

    row.innerHTML = `
      <div class="time">${start} - ${end}</div>
      <div class="name">${name}</div>
      <div class="dur">${duration}분</div>
    `;

    list.appendChild(row);
  });

  let totalStudy = 0;

  S.forEach(([start,end,name]) => {

    if(name !== "점심" && name !== "저녁"){
      totalStudy += mins(end) - mins(start);
    }

  });

  const totalH = Math.floor(totalStudy / 60);
  const totalM = totalStudy % 60;

  $("total").textContent =
    `${totalH}시간 ${pad(totalM)}분 / 10시간 30분`;

  if(activeIndex >= 0){

    const [start,end,name] = S[activeIndex];

    const st = mins(start);
    const en = mins(end);

    const remainSec =
      Math.max(0, Math.round((en - current) * 60));

    const progress =
      Math.min(
        1,
        Math.max(
          0,
          (current - st) / (en - st)
        )
      );

    $("period").textContent = name;

    $("remain").textContent =
      formatRemain(remainSec);

    $("progress").style.strokeDashoffset =
      C * (1 - progress);

  }else{

    $("progress").style.strokeDashoffset = C;

    if(current < mins(S[0][0])){

      const diff =
        Math.max(
          0,
          Math.round(
            (mins(S[0][0]) - current) * 60
          )
        );

      $("period").textContent = "시작 전";

      $("remain").textContent =
        formatRemain(diff);

    }else{

      $("period").textContent = "오늘 끝";

      $("remain").textContent =
        "수고했어요";
    }
  }
}

render();

setInterval(render,1000);
</script>

</body>
</html>
