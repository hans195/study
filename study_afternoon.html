<title>Afternoon</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#090d14;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

.app{
  width:100%;
  height:100%;
  max-width:600px;
  padding:18px;
  display:flex;
  flex-direction:column;
}

.top{
  text-align:center;
  flex:none;
}

.date{
  font-size:18px;
  color:#9aa4b2;
  margin-bottom:3px;
}

.clock{
  font-size:28px;
  font-weight:700;
  letter-spacing:-1px;
}

.badge{
  display:inline-block;
  margin-top:6px;
  padding:5px 9px;
  border-radius:999px;
  background:#2a2614;
  color:#facc15;
  font-size:10px;
  font-weight:600;
}

.ringWrap{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex:1;
  margin:8px 0;
}

.ring{
  width:min(58vw,280px);
  height:min(58vw,280px);
  position:relative;
}

.ring svg{
  width:100%;
  height:100%;
  transform:rotate(-90deg);
}

.ring-bg{
  fill:none;
  stroke:#202938;
  stroke-width:10;
}

.ring-progress{
  fill:none;
  stroke:#facc15;
  stroke-width:10;
  stroke-linecap:round;
  transition:stroke-dashoffset .5s linear;
}

.center{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.period{
  font-size:15px;
  color:#9aa4b2;
  margin-bottom:5px;
}

.remain{
  font-size:46px;
  font-weight:800;
  letter-spacing:-2px;
}

.label{
  margin-top:3px;
  font-size:11px;
  color:#8b95a5;
}

.total{
  flex:none;
  width:fit-content;
