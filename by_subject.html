
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="by subject">
<title>by subject</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #090d14;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont,
    "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.app {
  width: 100%;
  height: 100%;
  max-width: 600px;
  padding: 14px;
  display: flex;
  flex-direction: column;
}

.top {
  text-align: center;
  flex: none;
}

.date {
  font-size: 17px;
  color: #9aa4b2;
  margin-bottom: 3px;
}

.clock {
  font-size: 27px;
  font-weight: 700;
  letter-spacing: -1px;
}

.badge {
  display: inline-block;
  margin-top: 5px;
  padding: 4px 9px;
  border-radius: 999px;
  background: #2a2614;
  color: #facc15;
  font-size: 10px;
  font-weight: 600;
}

.ringWrap {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  min-height: 0;
  margin: 6px 0;
}

.ring {
  width: min(55vw, 270px);
  aspect-ratio: 1;
  position: relative;
}

.ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}

.ring-bg {
  fill: none;
  stroke: #202938;
  stroke-width: 10;
}

.ring-progress {
  fill: none;
  stroke: #facc15;
  stroke-width: 10;
  stroke-linecap: round;
  transition: stroke-dashoffset .5s linear;
}

.center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.period {
  font-size: 14px;
  color: #9aa4b2;
  margin-bottom: 5px;
}

.remain {
  font-size: clamp(27px, 8vw, 46px);
  font-weight: 800;
  letter-spacing: -2px;
}

.label {
  margin-top: 3px;
  font-size: 11px;
  color: #8b95a5;
}

.total {
  flex: none;
  min-width: 190px;
  width: fit-content;
  margin: 4px auto 10px;
  padding: 8px 13px;
  border: 1px solid #202938;
  border-radius: 12px;
  background: #111722;
  text-align: center;
}

.total small {
  display: block;
  color: #8b95a5;
  font-size: 9px;
  margin-bottom: 3px;
}

.total strong {
  font-size: 12px;
}

.right {
  flex: none;
  min-height: 0;
}

.tableTitle {
  color: #697386;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  margin-bottom: 5px;
  text-align: center;
}

.list {
  display: grid;
  gap: 1px;
}

.row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  column-gap: 9px;
  align-items: center;
  min-height: 33px;
  padding: 5px 8px;
  border: 1px solid #1d2635;
  border-radius: 8px;
  background: #111722;
}

.row.active {
  background: #2a2614;
  border-color: #facc15;
}

.name {
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}

.time {
  font-size: 10px;
  color: #8b95a5;
  font-weight: 700;
  white-space: nowrap;
}

.dur {
  font-size: 10px;
  color: #8b95a5;
  white-space: nowrap;
}

.row.active .name {
  color: #fde047;
}

/* 가로 화면: 왼쪽 타이머 + 오른쪽 시간표 */
@media (orientation: landscape) {
  .app {
    max-width: 1100px;
    width: 100%;
    height: 100dvh;
    padding:
      calc(10px + env(safe-area-inset-top))
      calc(18px + env(safe-area-inset-right))
      calc(10px + env(safe-area-inset-bottom))
      calc(18px + env(safe-area-inset-left));
    display: grid;
    grid-template-columns: minmax(0, 60%) minmax(0, 40%);
    grid-template-rows: auto minmax(0, 1fr) auto;
    column-gap: 12px;
  }

  .top {
    grid-column: 1;
    grid-row: 1;
    z-index: 1;
  }

  .ringWrap {
    grid-column: 1;
    grid-row: 2;
    margin: 0;
    min-height: 0;
  }

  .ring {
    width: min(50vh, 350px);
    max-height: 100%;
  }

  .remain {
    font-size: clamp(30px, 6vh, 54px);
  }

  .period {
    font-size: 15px;
  }

  .total {
    grid-column: 1;
    grid-row: 3;
    align-self: center;
    justify-self: center;
    margin: 4px auto 0;
    min-width: 215px;
  }

  .right {
    grid-column: 2;
    grid-row: 1 / 4;
    align-self: center;
    justify-self: center;
    width: 100%;
    max-width: 360px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
  }

  .tableTitle {
    flex: none;
    margin-bottom: 5px;
  }

  .list {
    min-height: 0;
    grid-template-rows: repeat(12, minmax(0, 1fr));
    height: min(88dvh, 540px);
    gap: 1px;
  }

  .row {
    min-height: 0;
    height: 100%;
    padding: 2px 7px;
    border-radius: 7px;
    column-gap: 6px;
  }

  .name {
    font-size: clamp(10px, 1.8vh, 13px);
  }

  .time, .dur {
    font-size: clamp(8px, 1.55vh, 11px);
  }
}

/* 높이가 낮은 가로 화면 */
@media (orientation: landscape) and (max-height: 430px) {
  .app {
    padding:
      calc(6px + env(safe-area-inset-top))
      calc(12px + env(safe-area-inset-right))
      calc(6px + env(safe-area-inset-bottom))
      calc(12px + env(safe-area-inset-left));
  }

  .date {
    font-size: 15px;
  }

  .clock {
    font-size: 21px;
  }

  .badge {
    font-size: 8px;
    margin-top: 2px;
    padding: 3px 7px;
  }

  .ring {
    width: min(46vh, 290px);
  }

  .remain {
    font-size: clamp(27px, 6vh, 40px);
  }

  .period {
    font-size: 12px;
  }

  .label {
    font-size: 9px;
  }

  .total {
    padding: 5px 10px;
    min-width: 175px;
  }

  .total small {
    font-size: 8px;
  }

  .total strong {
    font-size: 10px;
  }

  .tableTitle {
    font-size: 10px;
    margin-bottom: 3px;
  }

  .list {
    height: min(90dvh, 370px);
  }

  .row {
    padding: 1px 5px;
  }

  .name {
    font-size: 10px;
  }

  .time, .dur {
    font-size: 8px;
  }
}

/* 세로 화면에서는 오른쪽 시간표 스크롤 허용 */
@media (orientation: portrait) {
  .app {
    overflow-y: auto;
  }

  .ringWrap {
    flex: none;
    margin: 12px 0;
  }

  .ring {
    width: min(55vw, 260px);
  }

  .right {
    padding-bottom: 12px;
  }
}
</style>
</head>

<body>
<div class="app">

  <div class="top">
    <div class="date" id="date"></div>
    <div class="clock" id="clock"></div>
    <div class="badge">실시간 자동</div>
  </div>

  <div class="ringWrap">
    <div class="ring">
      <svg viewBox="0 0 300 300">
        <circle class="ring-bg"
          cx="150" cy="150" r="136"></circle>
        <circle class="ring-progress"
          id="progress"
          cx="150" cy="150" r="136"></circle>
      </svg>

      <div class="center">
        <div class="period" id="period">시작 전</div>
        <div class="remain" id="remain">00:00</div>
        <div class="label">남은 시간</div>
      </div>
    </div>
  </div>

  <div class="total">
    <small>오늘 총 공부시간</small>
    <strong id="total">0시간 00분 / 11시간 10분</strong>
  </div>

  <div class="right">
    <div class="tableTitle">TIME TABLE</div>
    <div class="list" id="list"></div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

const S = [
  ["Lecture 1", "08:30", "10:00"],
  ["Break", "10:00", "10:15"],
  ["Lecture 2", "10:15", "11:45"],
  ["Lunch", "11:45", "12:35"],
  ["Lecture 3", "12:35", "14:05"],
  ["Break", "14:05", "14:20"],
  ["Lecture 4", "14:20", "15:50"],
  ["Break", "15:50", "16:05"],
  ["경제학", "16:05", "16:50"],
  ["재무관리", "16:50", "17:35"],
  ["Dinner", "17:35", "18:25"],
  ["상법", "18:25", "18:55"],
  ["세법", "18:55", "19:55"],
  ["Break", "19:55", "20:10"],
  ["재무회계", "20:10", "20:55"],
  ["원가", "20:55", "21:40"],
  ["Break", "21:40", "21:55"],
  ["경영학", "21:55", "22:15"],
  ["외감법", "22:15", "22:35"]
];

const pad = n => String(n).padStart(2, "0");

function mins(t) {
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

function isRest(name) {
  return ["Break", "Lunch", "Dinner"].includes(name);
}

const TOTAL_STUDY_MINUTES = S.reduce(
  (sum, [name, start, end]) =>
    sum + (isRest(name) ? 0 : mins(end) - mins(start)),
  0
);

function formatRemain(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;

  return h > 0
    ? `${h}:${pad(m)}:${pad(s)}`
    : `${pad(m)}:${pad(s)}`;
}

const C = 2 * Math.PI * 136;
$("progress").style.strokeDasharray = C;
$("progress").style.strokeDashoffset = C;

/* 오른쪽에는 공부 과목만 표시 */
function renderSchedule(current) {
  const list = $("list");
  list.innerHTML = "";

  S.forEach(([name, start, end]) => {
    if (isRest(name)) return;

    const st = mins(start);
    const en = mins(end);

    const row = document.createElement("div");
    row.className = "row";

    if (current >= st && current < en) {
      row.classList.add("active");
    }

    row.innerHTML = `
      <div class="name">${name}</div>
      <div class="time">${start} - ${end}</div>
      <div class="dur">(${en - st}')</div>
    `;

    list.appendChild(row);
  });
}

/* 누적 순공부 시간 */
function updateTotalStudy(current) {
  let studied = 0;

  S.forEach(([name, start, end]) => {
    if (isRest(name)) return;

    const st = mins(start);
    const en = mins(end);

    if (current >= en) {
      studied += en - st;
    } else if (current > st) {
      studied += current - st;
    }
  });

  studied = Math.min(
    TOTAL_STUDY_MINUTES,
    Math.max(0, Math.floor(studied))
  );

  $("total").textContent =
    `${Math.floor(studied / 60)}시간 ${pad(studied % 60)}분 / ` +
    `${Math.floor(TOTAL_STUDY_MINUTES / 60)}시간 ` +
    `${pad(TOTAL_STUDY_MINUTES % 60)}분`;
}

function update() {
  const now = new Date();
  const days = ["일", "월", "화", "수", "목", "금", "토"];

  $("date").textContent =
    `${now.getFullYear()}년 ${now.getMonth() + 1}월 ` +
    `${now.getDate()}일 (${days[now.getDay()]})`;

  $("clock").textContent =
    `${pad(now.getHours())}:` +
    `${pad(now.getMinutes())}:` +
    `${pad(now.getSeconds())}`;

  const current =
    now.getHours() * 60 +
    now.getMinutes() +
    now.getSeconds() / 60;

  renderSchedule(current);
  updateTotalStudy(current);

  const active = S.find(
    ([name, start, end]) =>
      current >= mins(start) && current < mins(end)
  );

  if (active) {
    const [name, start, end] = active;
    const st = mins(start);
    const en = mins(end);
    const progress = (current - st) / (en - st);

    $("progress").style.strokeDashoffset = C * progress;
    $("period").textContent =
      name === "Break" ? "쉬는 시간" : name;
    $("remain").textContent =
      formatRemain((en - current) * 60);
    return;
  }

  if (current < mins(S[0][1])) {
    $("period").textContent = "시작 전";
    $("remain").textContent =
      formatRemain((mins(S[0][1]) - current) * 60);
    $("progress").style.strokeDashoffset = C;
    return;
  }

  $("period").textContent = "오늘 끝";
  $("remain").textContent = "수고했어요";
  $("progress").style.strokeDashoffset = C;
}

update();
setInterval(update, 1000);
</script>
</body>
</html>
